version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ../models:/models:ro
      - ../reports:/reports:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      - FRAUDGUARD_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
